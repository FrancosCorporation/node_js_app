name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Lint
        run: npm run lint
      - name: Build TypeScript
        run: npm run build
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
        env:
          DB_USER: ci_user
          DB_PASS: ci_password
          DB_NAME: node_js_app
          JWT_SECRET: ci-only-secret-not-used-for-authentication-0123456789
